name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:

  test:
    name: ${{ matrix.server }}-${{ matrix.version }} (${{ matrix.algorithm }}, sanitizer=${{ matrix.sanitizer }}${{ matrix.os && ', arm64' || '' }})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {server: redis, version: '5.0', algorithm: scan, sanitizer: none}
          - {server: redis, version: '6.2', algorithm: scan, sanitizer: none}
          - {server: redis, version: '7.0', algorithm: scan, sanitizer: none, coverage: true}
          - {server: redis, version: '7.0', algorithm: sort, sanitizer: none, coverage: true}
          - {server: redis, version: '7.0', algorithm: slab, sanitizer: none, coverage: true}
          - {server: redis, version: '7.0', algorithm: scan, sanitizer: address}
          - {server: redis, version: '7.0', algorithm: sort, sanitizer: address}
          - {server: redis, version: '7.2.17', algorithm: scan, sanitizer: none}
          - {server: redis, version: '7.4.12', algorithm: scan, sanitizer: none}
          # SORT and SLAB mode run on Redis 7.0 only: on newer servers they expose expire
          # index bugs (a key-name refcount race, the AVX2 slab split) that are fixed separately.
          - {server: redis, version: '8.10.3', algorithm: scan, sanitizer: none}
          - {server: redis, version: '8.10.3', algorithm: scan, sanitizer: address}
          - {server: valkey, version: '7.2.15', algorithm: scan, sanitizer: none}
          - {server: valkey, version: '8.1.11', algorithm: scan, sanitizer: none}
          - {server: valkey, version: '9.1.3', algorithm: scan, sanitizer: none}
          - {server: valkey, version: '9.1.3', algorithm: scan, sanitizer: address}
          # arm64: no AVX2, so SLAB mode runs its scalar path.
          - {server: redis, version: '7.0', algorithm: slab, sanitizer: none, os: ubuntu-26.04-arm}
          - {server: valkey, version: '9.1.3', algorithm: scan, sanitizer: none, os: ubuntu-26.04-arm}
    # Prefixed so the server build does not read them: its Makefile rejects SANITIZER=none.
    env:
      MATRIX_SERVER: ${{ matrix.server }}
      MATRIX_VERSION: ${{ matrix.version }}
      MATRIX_ALGORITHM: ${{ matrix.algorithm }}
      MATRIX_SANITIZER: ${{ matrix.sanitizer }}
      MATRIX_COVERAGE: ${{ matrix.coverage && 'yes' || 'no' }}
    steps:
    - uses: actions/checkout@v7
    - name: install dependencies
      run: |
        sudo apt-get update
        packages=(tcl8.6)
        if [ "$MATRIX_COVERAGE" = yes ]; then
          packages+=(lcov)
        fi
        sudo apt-get install -y "${packages[@]}"
    - name: build and test
      run: |
        args=(--server "$MATRIX_SERVER" --server-ref "$MATRIX_VERSION" --mode "$MATRIX_ALGORITHM" --clients 1)
        if [ "$MATRIX_SANITIZER" != none ]; then
          args+=(--sanitizer "$MATRIX_SANITIZER")
        fi
        if [ "$MATRIX_COVERAGE" = yes ]; then
          args+=(--coverage)
        fi
        tests/run.sh "${args[@]}"
    - name: lcov collection
      if: matrix.coverage
      run: lcov -c -d "build/$MATRIX_ALGORITHM-cov" -o build/cover.info
    - uses: codecov/codecov-action@v7
      if: matrix.coverage
      with:
        files: build/cover.info
        flags: ${{ matrix.algorithm }}
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
